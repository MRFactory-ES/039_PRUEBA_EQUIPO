<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tablón del equipo</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    header { max-width: 900px; margin: 0 auto 28px; display: flex; align-items: center; gap: 16px; }
    header img { width: 64px; height: auto; }
    h1 { margin: 0; font-size: 1.6rem; }
    header p { margin: 4px 0 0; color: #8b949e; }
    main {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .tarjeta {
      display: block;
      background: #161b22;
      border: 1px solid #30363d;
      border-top: 6px solid var(--color);
      border-radius: 10px;
      padding: 16px;
      color: inherit;
      text-decoration: none;
    }
    .tarjeta:hover { border-color: var(--color); }
    .tarjeta h2 { margin: 0; font-size: 1.2rem; }
    .abrir { margin: 8px 0 0; color: #8b949e; font-size: .9rem; }
    footer { max-width: 900px; margin: 32px auto 0; color: #8b949e; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <img src="img/logo.png" alt="MR Factory">
    <div>
      <h1>Tablón del equipo</h1>
      <p>Testing Pull requests</p>
    </div>
  </header>

  <main id="tablon"></main>

  <footer>Cada uno cambia su página, en la carpeta <code>paginas/</code>. Cómo, en README.md.</footer>

  <script src="equipo.js"></script>
  <script>
    const tablon = document.getElementById("tablon");
    for (const persona of EQUIPO) {
      const tarjeta = document.createElement("a");
      tarjeta.className = "tarjeta";
      tarjeta.href = persona.pagina;
      tarjeta.style.setProperty("--color", persona.color);
      const nombre = document.createElement("h2");
      nombre.textContent = persona.nombre;
      const abrir = document.createElement("p");
      abrir.className = "abrir";
      abrir.textContent = "Abrir página →";
      tarjeta.append(nombre, abrir);
      tablon.appendChild(tarjeta);
    }
  </script>
</body>
</html>
